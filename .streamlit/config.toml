# Tema aplikasi TEPAT. Satu-satunya tempat warna dan font didefinisikan.
# Warna rute dan status ada di tepat_ui.py (RUTE, WARNA) dan memakai palet deck yang sama.
#
# Font: satu keluarga "Tepat" yang dirakit dari dua font.
#   huruf  : Plus Jakarta Sans (sama dengan deck proposal dan flowchart)
#   angka  : JetBrains Mono (sama dengan deck), hanya untuk karakter 0-9 (unicodeRange U+0030-0039)
# Karena dipisah per rentang karakter, angka di tabel, metrik, grafik, dan kalimat
# otomatis memakai font angka tanpa CSS per elemen. Berkas font ada di static/fonts (OFL).

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
# palet deck proposal TEPAT (slide isi: latar #F6F5F0, tinta #12302A, aksen #17704D)
primaryColor = "#17704D"
backgroundColor = "#F6F5F0"
secondaryBackgroundColor = "#ECEBE4"
textColor = "#12302A"
borderColor = "#DCDFD7"
dataframeBorderColor = "#E3E5DE"
dataframeHeaderBackgroundColor = "#E6E4DC"
dataframeHeaderTextColor = "#12302A"
linkColor = "#17704D"
linkUnderline = false
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "999px"
baseFontSize = 15
font = "Tepat, sans-serif"
headingFont = "Tepat, sans-serif"
codeFont = "Tepat Mono, monospace"
headingFontSizes = ["1.85rem", "1.15rem", "1rem", "0.95rem"]
headingFontWeights = [800, 700, 650, 600]
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
greenColor = "#17704D"
orangeColor = "#9A5F0E"
blueColor = "#2F5D8C"
redColor = "#9A3F12"
violetColor = "#7A4A9E"
grayColor = "#5E6B66"
chartCategoricalColors = ["#17704D", "#9A5F0E", "#2F5D8C", "#9A3F12", "#7A4A9E", "#5E6B66", "#1E8A5F", "#8F9993"]

# ---- huruf: Plus Jakarta Sans, semua karakter kecuali 0-9 ----
[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/plus-jakarta-sans-latin-400-normal.woff2"
weight = 400
unicodeRange = "U+0000-002F, U+003A-FFFF"

[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/plus-jakarta-sans-latin-500-normal.woff2"
weight = 500
unicodeRange = "U+0000-002F, U+003A-FFFF"

[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/plus-jakarta-sans-latin-600-normal.woff2"
weight = 600
unicodeRange = "U+0000-002F, U+003A-FFFF"

[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/plus-jakarta-sans-latin-700-normal.woff2"
weight = 700
unicodeRange = "U+0000-002F, U+003A-FFFF"

[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/plus-jakarta-sans-latin-800-normal.woff2"
weight = 800
unicodeRange = "U+0000-002F, U+003A-FFFF"

# ---- angka: JetBrains Mono, hanya 0-9. Bobot 800 memakai berkas 700 (JetBrains Mono di sini sampai 700). ----
[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/jetbrains-mono-latin-400-normal.woff2"
weight = 400
unicodeRange = "U+0030-0039"

[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/jetbrains-mono-latin-500-normal.woff2"
weight = 500
unicodeRange = "U+0030-0039"

[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/jetbrains-mono-latin-600-normal.woff2"
weight = 600
unicodeRange = "U+0030-0039"

[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/jetbrains-mono-latin-700-normal.woff2"
weight = 700
unicodeRange = "U+0030-0039"

[[theme.fontFaces]]
family = "Tepat"
url = "app/static/fonts/jetbrains-mono-latin-700-normal.woff2"
weight = 800
unicodeRange = "U+0030-0039"

# ---- kode / ID mentah ----
[[theme.fontFaces]]
family = "Tepat Mono"
url = "app/static/fonts/jetbrains-mono-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "Tepat Mono"
url = "app/static/fonts/jetbrains-mono-latin-500-normal.woff2"
weight = 500
